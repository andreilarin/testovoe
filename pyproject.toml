[project]
name = "payments"
version = "0.1.0"
description = "Asynchronous payment processing service"
readme = "README.md"
authors = [
    { name = "Andrei Larin", email = "larinlovkach@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.115",
    "faststream[cli,rabbit]>=0.7.7",
    "httpx>=0.28.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
